<button onclick="obtenerUbicacion()">📍 Usar mi ubicación</button>

<p id="resultado"></p>

<script>
function obtenerUbicacion() {
    const resultado = document.getElementById("resultado");

    if (!navigator.geolocation) {
        resultado.textContent = "Tu navegador no admite la geolocalización.";
        return;
    }

    resultado.textContent = "Obteniendo ubicación...";

    navigator.geolocation.getCurrentPosition(
        function(posicion) {
            const latitud = posicion.coords.latitude;
            const longitud = posicion.coords.longitude;

            resultado.textContent =
                "Ubicación obtenida correctamente: " +
                latitud + ", " + longitud;
        },
        function(error) {
            switch (error.code) {
                case error.PERMISSION_DENIED:
                    resultado.textContent =
                        "Has denegado el permiso de ubicación.";
                    break;

                case error.POSITION_UNAVAILABLE:
                    resultado.textContent =
                        "No se ha podido obtener tu ubicación.";
                    break;

                case error.TIMEOUT:
                    resultado.textContent =
                        "Se ha agotado el tiempo para obtener la ubicación.";
                    break;

                default:
                    resultado.textContent =
                        "Error desconocido al obtener la ubicación.";
            }
        },
        {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        }
    );
}
</script>
